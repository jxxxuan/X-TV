# ==============================================================================
# X-TV Nginx 反向代理配置片段
# ==============================================================================
#
# 使用方式（二选一）：
#
# 【方式 1（推荐）】：在已有的 server { listen 80; ... } 块中直接 include 此文件：
#   server {
#       listen 80;
#       ...
#       include /home/jxxxuan/Github/X-TV/nginx/xtv.conf;
#   }
#
# 【方式 2】：将以下 location 块直接复制粘贴进你的 80 端口 server { ... } 内部。
#
# ==============================================================================

location /xtv {
    # 转发至 X-TV 容器暴露的宿主机端口（默认为 8899，原样透传 /xtv 完整路径）
    proxy_pass http://127.0.0.1:8899;

    # 启用 HTTP/1.1 并支持 WebSocket（NDJSON 流式测活与聚合搜索）
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 传递客户端真实 IP、Host 与协议
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 针对点播视频分片与直播流关闭缓冲，消除首帧卡顿，确保秒开
    proxy_buffering off;
    proxy_request_buffering off;

    # 放宽超时时间，避免视频长分片缓冲或测活长连接被 Nginx 中断
    proxy_connect_timeout 60s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # 允许上传自定义订阅与大列表配置
    client_max_body_size 50m;
}

